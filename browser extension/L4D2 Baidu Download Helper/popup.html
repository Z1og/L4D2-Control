<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L4D2 百度直链助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="eyebrow">L4D2 CONTROL · DOWNLOAD HELPER</div>
    <h1>百度网盘直链</h1>
    <p class="copy">只修改你绑定的面板标签页发往百度下载域名的请求；其他标签页不受影响。</p>
    <section class="status" aria-live="polite">
      <span class="dot" id="dot"></span>
      <div><strong id="status">检查绑定状态…</strong><small id="origin"></small></div>
    </section>
    <button class="primary" id="bind" type="button">绑定当前面板标签页</button>
    <button class="secondary" id="disable" type="button" hidden>关闭扩展规则</button>
    <p class="note" id="notice"></p>
    <footer>扩展不读取网页正文、不储存下载链接、不配置代理。下载数据由百度直接发送给你的电脑；浏览器重启后需重新绑定。</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
